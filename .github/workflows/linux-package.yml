name: Linux package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libx11-dev xvfb libvulkan1 mesa-vulkan-drivers

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Select Mesa software Vulkan driver
        run: |
          bun -e '
            import { appendFile } from "node:fs/promises";
            const candidates = ["/usr/share/vulkan/icd.d/lvp_icd.json", "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"];
            for(const path of candidates) {
              if(!await Bun.file(path).exists()) continue;
              await appendFile(process.env.GITHUB_ENV, `VK_DRIVER_FILES=${path}\n`);
              process.exit(0);
            }
            throw new Error("Could not find the Mesa Lavapipe ICD.");
          '

      - run: bun setup
      - run: bun run lint
      - run: bun run package
      - run: bun run test:package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostframe-dawn-linux-x64
          path: |
            build/package/hostframe-dawn-linux-x64.tar.gz
            build/package/hostframe-dawn-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
